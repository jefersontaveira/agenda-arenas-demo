{% extends "backoffice/base_dashboard.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 text-center p-4">
            <div class="card-body">
                <div class="text-danger mb-3">
                    <i class="bi bi-exclamation-triangle-fill fs-1"></i>
                </div>
                <h3 class="fw-bold mb-3">Confirmar Exclusão</h3>
                <p class="lead mb-2">Tem certeza que deseja apagar a quadra:</p>
                <h4 class="fw-bold text-danger mb-3">{{ court.name }}</h4>
                <p class="text-body-secondary small mb-4">
                    Essa ação não pode ser desfeita e o histórico associado a esta quadra pode ser afetado.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3 flex-wrap">
                        <a href="{% url 'backoffice:court_list' arena_slug=arena.slug %}" class="btn btn-action">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-action-danger">
                            <i class="bi bi-trash me-1"></i> Sim, Apagar Quadra
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
