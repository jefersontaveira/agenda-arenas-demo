{% extends "backoffice/base_dashboard.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 text-center p-4">
            <div class="card-body">
                <div class="text-danger mb-3">
                    <i class="bi bi-exclamation-triangle fs-1"></i>
                </div>
                <h3 class="fw-bold mb-3">Excluir Horário?</h3>
                <p class="lead">
                    Tem certeza que deseja remover o horário de <strong>{{ object.get_weekday_display }}</strong>?
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3 mt-4 flex-wrap">
                        <a href="{% url 'backoffice:opening_hours_list' arena_slug=arena.slug %}" class="btn btn-action">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-action-danger">
                            <i class="bi bi-trash me-1"></i> Sim, Excluir
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
