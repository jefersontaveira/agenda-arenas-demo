{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão da Arena - Senha Alterada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.92)), url('{% static "img/login_bg.jpg" %}') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
            color: #fff;
            text-align: center;
        }
        .login-card h4 {
            color: #fff;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .login-card p {
            color: #e2e8f0 !important;
            font-size: 0.95rem;
        }
        .btn-brand {
            background-color: #FFC107;
            color: #212529;
            font-weight: bold;
            border: none;
            transition: all 0.3s;
        }
        .btn-brand:hover {
            background-color: #ffca2c;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.4);
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="mb-4">
        <div class="bg-dark text-success rounded-3 d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
            </svg>
        </div>
        <h4>Senha Alterada!</h4>
        <p class="mt-3">Sua senha foi redefinida com sucesso. Você já pode acessar o sistema com sua nova senha.</p>
    </div>

    <a href="{% url 'login' %}" class="btn btn-brand w-100 btn-lg rounded-pill">Ir para o Login</a>
</div>

</body>
</html>
