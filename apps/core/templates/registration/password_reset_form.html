{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão da Arena - Recuperar Senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.92)), url('{% static "img/login_bg.jpg" %}') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
            color: #fff;
        }
        .login-card h4 {
            color: #fff;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .login-card .text-muted {
            color: #e2e8f0 !important;
        }
        .btn-brand {
            background-color: #FFC107;
            color: #212529;
            font-weight: bold;
            border: none;
            transition: all 0.3s;
        }
        .btn-brand:hover {
            background-color: #ffca2c;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.4);
        }

        /* Form Controls Glassmorphism */
        .form-label {
            color: #f8f9fa !important;
            letter-spacing: 0.5px;
        }
        .form-control {
            background-color: rgba(255, 255, 255, 0.2) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            color: #fff !important;
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.25) !important;
            border-color: #FFC107 !important;
            background-color: rgba(255, 255, 255, 0.3) !important;
        }
        
        .link-secondary {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .link-secondary:hover {
            color: #fff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <div class="bg-dark text-warning rounded-3 d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" class="bi bi-lock-fill" viewBox="0 0 16 16">
                <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
            </svg>
        </div>
        <h4>Redefinir Senha</h4>
        <p class="text-muted small">Informe seu e-mail cadastrado para receber o link de recuperação.</p>
    </div>

    <form method="post">
        {% csrf_token %}

        {% if form.errors %}
            <div class="alert alert-danger py-2 small text-center rounded-3 bg-danger text-white border-0 opacity-75">
                Não encontramos um usuário com este e-mail.
            </div>
        {% endif %}

        <div class="mb-4">
            <label class="form-label fw-bold small">E-mail</label>
            <input type="email" name="email" class="form-control form-control-lg" placeholder="exemplo@email.com" required autofocus>
        </div>

        <button type="submit" class="btn btn-brand w-100 btn-lg rounded-pill mb-4">Enviar Link</button>

        <div class="text-center border-top border-secondary pt-3">
            <a href="{% url 'login' %}" class="link-secondary small">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left me-1" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
                </svg>
                Voltar para o Login
            </a>
        </div>
    </form>
</div>

</body>
</html>
