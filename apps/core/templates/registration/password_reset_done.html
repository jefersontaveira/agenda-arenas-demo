{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão da Arena - E-mail Enviado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.92)), url('{% static "img/login_bg.jpg" %}') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
            color: #fff;
            text-align: center;
        }
        .login-card h4 {
            color: #fff;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .login-card p {
            color: #e2e8f0 !important;
            font-size: 0.95rem;
        }
        .btn-brand {
            background-color: #FFC107;
            color: #212529;
            font-weight: bold;
            border: none;
            transition: all 0.3s;
        }
        .btn-brand:hover {
            background-color: #ffca2c;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.4);
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="mb-4">
        <div class="bg-dark text-success rounded-3 d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-envelope-check-fill" viewBox="0 0 16 16">
                <path d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414.05 3.555ZM0 4.697v7.104l5.803-3.558L0 4.697ZM6.761 8.83l-6.57 4.026A2 2 0 0 0 2 14h12a2 2 0 0 0 1.808-1.144l-6.57-4.027L8 9.586l-1.239-.757Zm3.436-.586L16 11.801V4.697l-5.803 3.546Z"/>
            </svg>
        </div>
        <h4>E-mail Enviado!</h4>
        <p class="mt-3">Nós enviamos um e-mail com instruções para você redefinir sua senha.</p>
        <p>Se não encontrar o e-mail na sua caixa de entrada, verifique também sua pasta de <strong>Spam</strong> ou Lixo Eletrônico.</p>
    </div>

    <a href="{% url 'login' %}" class="btn btn-brand w-100 btn-lg rounded-pill">Voltar para o Login</a>
</div>

</body>
</html>
